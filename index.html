function losujFiszke() {
if (pula.length === 0) {

}

const wybrane = pula.splice(randomIndex, 1)[0];

document.getElementById('wpis-pl').innerText = wybrane.pl;
document.getElementById('wpis-pl').style.display = 'none';

document.getElementById('licznik').innerText = `Pozostało w cyklu: ${pula.length} z ${fiszki.length}`;
}

function pokazTlumaczenie() {
const el = document.getElementById('wpis-pl');
if (el.style.display === 'none' || el.style.display === '') {
el.style.display = 'block';
} else {
el.style.display = 'none';
}
}
